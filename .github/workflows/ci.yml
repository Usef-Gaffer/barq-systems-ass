name: CI

on:
  push:
  pull_request:

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker and Compose versions
        run: |
          docker --version
          docker compose version

      - name: Validate docker-compose.yml syntax
        run: docker compose config > /dev/null

      - name: Python syntax check
        run: |
          python3 -m py_compile app/server.py validate.py failure_test.py

      - name: Shellcheck backup/restore scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck backup.sh restore.sh

      - name: Build images
        run: docker compose build

      - name: Start environment
        run: docker compose up -d

      - name: Wait for readiness (bounded)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ready > /dev/null; then
              echo "Ready after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Environment did not become ready in time"
          docker compose logs
          exit 1

      - name: Run validation
        run: python3 validate.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
